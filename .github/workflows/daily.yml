name: 每日資料更新

# 交易日（週一至週五，台灣時間）跑兩次，見 docs/PoC報告.md 5.8、docs/專案上下文.md D50：
#   18:43 傍晚場：行情、法人、本益比已公布 → 先更新網站（不跑季報補抓與檢查報告，省 Actions 分鐘數）
#   23:27 夜間場：融資融券、外資持股也公布了 → 補齊當天資料，加跑季報補抓與檢查報告
# 休市日沒有資料，任務會自動判斷；GitHub 排程可能延遲或漏跑，下一場會往回補 10 天。
# 由 Supabase pg_cron 準時觸發（workflow_dispatch，mode=light/full）；GitHub 自己的排程常延遲數小時，已停用（D53）。
on:
  workflow_dispatch:
    inputs:
      lookback:
        description: "往回檢查幾天"
        default: "10"
      mode:
        description: "full = 完整（含季報補抓、檢查報告）；light = 傍晚場只更新行情"
        default: full

concurrency:
  group: pipeline-days
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PIPELINE_CACHE_DIR: ${{ github.workspace }}/.pcache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # 本機保留上次下載的 parquet，只下載有變動的檔（Supabase 免費方案每月傳輸 5 GB）
      - uses: actions/cache/restore@v4
        with:
          path: .pcache
          key: pcache-${{ github.run_id }}
          restore-keys: pcache-
      - name: 每日任務
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: |
          set -o pipefail
          python -m pipeline daily --lookback "${{ github.event.inputs.lookback || '10' }}" 2>&1 | tee -a run.log
      - name: 季報補抓
        if: github.event.schedule != '43 10 * * 1-5' && github.event.inputs.mode != 'light'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: |
          set -o pipefail
          python -m pipeline fin-refresh --budget-min 20 2>&1 | tee -a run.log
      - name: 篩選快照
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          set -o pipefail
          python -m pipeline snapshot 2>&1 | tee -a run.log
          python -m pipeline market 2>&1 | tee -a run.log
          python -m pipeline stocks 2>&1 | tee -a run.log
      - name: 警報評估與通知
        if: success()
        continue-on-error: true            # 警報失敗會在這一步顯示紅色，但不影響後面的回測資料
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          # 密鑰由 SUPABASE_SERVICE_KEY 衍生（網站端用同樣算法驗證），不用另設 Secret
          KEY=$(printf 'alerts-run:%s' "$SUPABASE_SERVICE_KEY" | sha256sum | cut -c1-40)
          set -o pipefail
          curl -fsS --max-time 90 -X POST -H "Authorization: Bearer $KEY" \
            https://tw-stock-screener-willy1212.vercel.app/api/alerts/run | tee -a run.log
          echo | tee -a run.log
      - name: 回測資料（增量）
        if: github.event.inputs.mode != 'light'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          set -o pipefail
          python -m pipeline backtest-data --budget-min 10 2>&1 | tee -a run.log
      - name: 資料檢查報告
        if: always() && github.event.schedule != '43 10 * * 1-5' && github.event.inputs.mode != 'light'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python -m pipeline report 2>&1 | tee -a run.log
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .pcache
          key: pcache-${{ github.run_id }}-${{ github.run_attempt }}
      - name: 保存執行紀錄
        if: always()
        run: .github/scripts/save-log.sh daily
