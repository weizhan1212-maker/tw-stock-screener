name: 每日資料更新

# 排程等歷史回補完成、且確認公布時間後再開啟（見 docs/專案上下文.md D24）
on:
  workflow_dispatch:
    inputs:
      lookback:
        description: "往回檢查幾天"
        default: "10"

concurrency:
  group: pipeline-days
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 每日任務
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: |
          set -o pipefail
          python -m pipeline daily --lookback "${{ github.event.inputs.lookback || '10' }}" 2>&1 | tee -a run.log
      - name: 季報補抓
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: |
          set -o pipefail
          python -m pipeline fin-refresh --budget-min 40 2>&1 | tee -a run.log
      - name: 篩選快照
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          set -o pipefail
          python -m pipeline snapshot 2>&1 | tee -a run.log
          python -m pipeline market 2>&1 | tee -a run.log
      - name: 資料檢查報告
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python -m pipeline report 2>&1 | tee -a run.log
      - name: 保存執行紀錄
        if: always()
        run: .github/scripts/save-log.sh daily
