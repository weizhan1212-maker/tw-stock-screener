name: 搬資料到 R2
# 一次性：把 Supabase Storage 的 market-data 全部複製到 Cloudflare R2（已存在且大小相同的檔跳過），最後核對檔數與大小。
# 沿用每日任務的本機快取，快取裡已有的 parquet 不用再從 Supabase 下載。
on:
  workflow_dispatch:
    inputs:
      verify_only:
        description: "只核對、不複製"
        default: "false"

concurrency:
  group: pipeline-days
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PIPELINE_CACHE_DIR: ${{ github.workspace }}/.pcache
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/cache/restore@v4
        with:
          path: .pcache
          key: pcache-${{ github.run_id }}
          restore-keys: pcache-
      - name: 複製與核對
        run: |
          set -o pipefail
          python -m pipeline migrate-r2 ${{ github.event.inputs.verify_only == 'true' && '--verify-only' || '' }} 2>&1 | tee run.log
