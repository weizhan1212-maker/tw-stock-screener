name: 歷史資料回補

# job=daily   證交所＋櫃買 4 年日資料（每次最多約 5.3 小時，chain=true 時自動接力到完成）
# job=finmind FinMind 8 年財報／月營收／股利（同上）
# job=smoke   小規模試跑：每日任務＋回補 3 天＋FinMind 2 檔，用來驗證設定
on:
  workflow_dispatch:
    inputs:
      job:
        description: "daily / finmind / smoke"
        default: smoke
      chain:
        description: "跑不完是否自動接力（true/false）"
        default: "false"

concurrency:
  group: ${{ github.event.inputs.job == 'finmind' && 'backfill-finmind' || 'pipeline-days' }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 檢查設定
        run: |
          echo "### 設定檢查" >> "$GITHUB_STEP_SUMMARY"
          [ -n "$SUPABASE_URL" ] && echo "- SUPABASE_URL：有" >> "$GITHUB_STEP_SUMMARY" || echo "- SUPABASE_URL：**沒有**（資料不會被保存）" >> "$GITHUB_STEP_SUMMARY"
          [ -n "$SUPABASE_SERVICE_KEY" ] && echo "- SUPABASE_SERVICE_KEY：有" >> "$GITHUB_STEP_SUMMARY" || echo "- SUPABASE_SERVICE_KEY：**沒有**" >> "$GITHUB_STEP_SUMMARY"
          [ -n "$FINMIND_TOKEN" ] && echo "- FINMIND_TOKEN：有" >> "$GITHUB_STEP_SUMMARY" || echo "- FINMIND_TOKEN：**沒有**（每小時只能 300 次）" >> "$GITHUB_STEP_SUMMARY"
      - name: 試跑
        if: github.event.inputs.job == 'smoke'
        run: |
          python -m pipeline daily --lookback 4
          python -m pipeline backfill-daily --max-days 3
          python -m pipeline backfill-finmind --max-codes 2
      - name: 日資料回補
        if: github.event.inputs.job == 'daily'
        run: python -m pipeline backfill-daily --budget-min 320 ${{ github.event.inputs.chain == 'true' && '--chain' || '' }}
      - name: FinMind 回補
        if: github.event.inputs.job == 'finmind'
        run: python -m pipeline backfill-finmind --budget-min 320 ${{ github.event.inputs.chain == 'true' && '--chain' || '' }}
