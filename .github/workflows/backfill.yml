name: 歷史資料回補

# job=daily   證交所＋櫃買 4 年日資料（每次最多約 5.3 小時，chain=true 時自動接力到完成）
# job=finmind FinMind 8 年財報／月營收／股利（同上）
# job=snapshot 重新產生網站用的篩選快照與市場總覽
# job=extras   補最近 70 個交易日的類股指數、法人金額、當沖、借券、鉅額（市場總覽走勢用）
# job=indices 補 4 年指數歷史（類股指數、加權指數開高低收、櫃買指數），約 1 小時
# job=smoke   小規模試跑：每日任務＋回補 3 天＋FinMind 2 檔，用來驗證設定
on:
  workflow_dispatch:
    inputs:
      job:
        description: "daily / finmind / snapshot / extras / indices / smoke"
        default: smoke
      chain:
        description: "跑不完是否自動接力（true/false）"
        default: "false"

concurrency:
  group: ${{ github.event.inputs.job == 'finmind' && 'backfill-finmind' || 'pipeline-days' }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 檢查設定
        run: |
          echo "### 設定檢查" >> "$GITHUB_STEP_SUMMARY"
          [ -n "$SUPABASE_URL" ] && echo "- SUPABASE_URL：有" >> "$GITHUB_STEP_SUMMARY" || echo "- SUPABASE_URL：**沒有**（資料不會被保存）" >> "$GITHUB_STEP_SUMMARY"
          [ -n "$SUPABASE_SERVICE_KEY" ] && echo "- SUPABASE_SERVICE_KEY：有" >> "$GITHUB_STEP_SUMMARY" || echo "- SUPABASE_SERVICE_KEY：**沒有**" >> "$GITHUB_STEP_SUMMARY"
          [ -n "$FINMIND_TOKEN" ] && echo "- FINMIND_TOKEN：有" >> "$GITHUB_STEP_SUMMARY" || echo "- FINMIND_TOKEN：**沒有**（每小時只能 300 次）" >> "$GITHUB_STEP_SUMMARY"
      - name: 試跑
        if: github.event.inputs.job == 'smoke'
        run: |
          set -o pipefail
          python -m pipeline daily --lookback 4 2>&1 | tee -a run.log
          python -m pipeline backfill-daily --max-days 3 2>&1 | tee -a run.log
          python -m pipeline backfill-finmind --max-codes 2 2>&1 | tee -a run.log
      - name: 日資料回補
        if: github.event.inputs.job == 'daily'
        run: |
          set -o pipefail
          python -m pipeline backfill-daily --budget-min 320 ${{ github.event.inputs.chain == 'true' && '--chain' || '' }} 2>&1 | tee -a run.log
      - name: FinMind 回補
        if: github.event.inputs.job == 'finmind'
        run: |
          set -o pipefail
          python -m pipeline backfill-finmind --budget-min 320 ${{ github.event.inputs.chain == 'true' && '--chain' || '' }} 2>&1 | tee -a run.log
      - name: 指數歷史回補
        if: github.event.inputs.job == 'indices'
        run: |
          set -o pipefail
          python -m pipeline backfill-indices --budget-min 320 2>&1 | tee -a run.log
          python -m pipeline market 2>&1 | tee -a run.log
      - name: 補充資料回補
        if: github.event.inputs.job == 'extras'
        run: |
          set -o pipefail
          python -m pipeline backfill-extras --days 70 2>&1 | tee -a run.log
      - name: 篩選快照與市場總覽
        if: github.event.inputs.job == 'snapshot' || github.event.inputs.job == 'extras'
        run: |
          set -o pipefail
          python -m pipeline snapshot 2>&1 | tee -a run.log
          python -m pipeline market 2>&1 | tee -a run.log
      - name: 資料檢查報告
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python -m pipeline report 2>&1 | tee -a run.log
      - name: 保存執行紀錄
        if: always()
        run: .github/scripts/save-log.sh backfill
